<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: 'Press Start 2P', cursive; }
        
        /* Contenitore per lo screenshot 1920x1080 */
        .canvas {
            width: 1920px; height: 1080px;
            display: flex; justify-content: space-around; align-items: center;
            position: relative; overflow: hidden;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
        }

        .character {
            width: 400px; height: 400px;
            image-rendering: pixelated; /* Fondamentale per la Pixel Art */
            filter: drop-shadow(0 0 20px rgba(0,255,0,0.2));
        }

        .info-center { text-align: center; z-index: 10; }
        
        h1 { font-size: 60px; margin-bottom: 10px; color: #00ff00; text-shadow: 4px 4px black; }
        p { font-size: 20px; color: #888; }

        .tag {
            position: absolute; bottom: 50px; border: 2px solid #333;
            padding: 10px 20px; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <div style="text-align: center;">
            <img src="Rookie_Blanco.png" class="character">
            <p style="margin-top:20px;">ROOKIE BLANCO</p>
        </div>

        <div class="info-center">
            <h1>ZERO CONTACT</h1>
            <p style="color: #fff;">THE SECRET DOCUMENTS</p>
            <div style="margin-top: 50px; font-size: 12px; color: #444;">
                A PREMIUM STEALTH PUZZLE GAME
            </div>
        </div>

        <div style="text-align: center;">
            <img src="Agent_Green.png" class="character">
            <p style="margin-top:20px; color: #00ff00;">AGENT GREEN</p>
        </div>

        <div class="tag" style="left: 50px;">THE PROLOGUE (FREE)</div>
        <div class="tag" style="right: 50px; border-color: #00ff00;">THE MISSION (PREMIUM)</div>
    </div>
</body>
</html>
